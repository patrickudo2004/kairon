<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Kairon - The ultimate event production timer. Manage your schedule live, sync with your team, and share beautiful public schedules with attendees." />
    <!-- OpenGraph / Social Media -->
    <meta property="og:title" content="Kairon - Pro Event Production Timer" />
    <meta property="og:description" content="Live event scheduling, synchronized timers, and attendee viewing portals." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Kairon - Production Timer</title>
    <link rel="icon" type="image/png" href="/kairon-logo.png" />
    <link rel="apple-touch-icon" href="/kairon-logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              studio: {
                bg: '#090A0C',
                card: '#121418',
                elevated: '#1A1D24',
                inset: '#0D0F12',
                border: '#22262E',
                subtle: '#181B22',
                ice: '#0EA5E9',
                emerald: '#10B981',
                amber: '#F59E0B',
                crimson: '#EF4444',
                text: '#E1E4EA',
                muted: '#8A93A4',
              },
              slate: {
                850: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'tally': 'tallyPulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #f8fafc;
        color: #0f172a;
      }
      .dark body {
        background-color: #090A0C;
        color: #E1E4EA;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }

      /* Helper for print visibility */
      .only-print {
        display: none;
      }

      /* Print Styles - Robust Overrides */
      @media print {
        @page {
          size: portrait;
          margin: 10mm 12mm;
          background-color: #ffffff !important;
        }

        html, body, #root, #root > div, [class*="dark"] {
          background: #ffffff !important;
          background-color: #ffffff !important;
          color: #0f172a !important;
          border: none !important;
          box-shadow: none !important;
          outline: none !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
          height: auto !important;
        }

        /* Hide all interactive app shell elements */
        .no-print,
        aside,
        header,
        nav,
        button,
        input,
        select,
        textarea,
        [role="dialog"] {
          display: none !important;
        }

        /* Hide everything by default */
        body * {
          visibility: hidden;
        }

        /* Re-enable visibility for printable area and its children */
        #printable-area, #printable-area * {
          visibility: visible !important;
        }

        /* Position printable area statically on clean white canvas */
        #printable-area {
          display: block !important;
          position: static !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          background-color: #ffffff !important;
          color: #0f172a !important;
          border: none !important;
          box-shadow: none !important;
          outline: none !important;
        }

        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
