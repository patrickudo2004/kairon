<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kairon - The ultimate event production timer. Manage your schedule live, sync with your team, and share beautiful public schedules with attendees." />
    <!-- OpenGraph / Social Media -->
    <meta property="og:title" content="Kairon - Pro Event Production Timer" />
    <meta property="og:description" content="Live event scheduling, synchronized timers, and attendee viewing portals." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Kairon - Production Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              slate: {
                850: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        },
      }
    </script>
    <style>
      body {
        /* Default to light mode colors, overridden by dark mode class */
        background-color: #f8fafc;
        color: #0f172a;
      }
      .dark body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }

      /* Helper for print visibility */
      .only-print {
        display: none;
      }

      /* Print Styles - Robust Overrides */
      @media print {
        /* Hide everything by default */
        body * {
          visibility: hidden;
        }

        /* Force exact colors so backgrounds print */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Re-enable visibility for printable area and its children */
        #printable-area, #printable-area * {
          visibility: visible;
        }

        /* Position printable area over everything else */
        #printable-area {
          display: block !important;
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 20px; /* Add some padding for paper */
          background-color: white !important;
          color: black !important;
        }

        /* Ensure body allows full height printing */
        body, html {
          height: auto !important;
          overflow: visible !important;
          background-color: white !important;
        }

        /* Override dark mode text and backgrounds for print */
        .dark \:text-white, .dark\:text-white { color: #0f172a !important; }
        .dark \:text-slate-400, .dark\:text-slate-400 { color: #64748b !important; }
        .dark \:text-slate-300, .dark\:text-slate-300 { color: #475569 !important; }
        .dark \:bg-slate-900, .dark\:bg-slate-900 { background-color: #ffffff !important; }
        .dark \:bg-slate-800, .dark\:bg-slate-800 { background-color: #f8fafc !important; }
        .dark \:bg-slate-800\/50, .dark\:bg-slate-800\/50 { background-color: #f8fafc !important; }
        .dark \:border-slate-800, .dark\:border-slate-800 { border-color: #e2e8f0 !important; }
        .dark \:border-slate-700, .dark\:border-slate-700 { border-color: #cbd5e1 !important; }

        /* Explicitly hide the interactive app wrapper */
        .no-print {
          display: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react-qr-code": "https://aistudiocdn.com/react-qr-code@^2.0.15"
  }
}
</script>

</head>
